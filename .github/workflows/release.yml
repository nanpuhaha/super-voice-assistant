name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.1"

      - name: Build App
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Create ZIP
        run: |
          zip -r SuperVoiceAssistant.zip SuperVoiceAssistant.app

      - name: Generate Release Tag
        id: generate_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            DATE=$(date +'%Y%m%d')
            echo "RELEASE_TAG=CI-Build-${DATE}.${{ github.run_id }}" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: SuperVoiceAssistant.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
